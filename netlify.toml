[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "!node_modules/@tensorflow/**",
    "!node_modules/nsfwjs/**",
    "!node_modules/sanity/**",
    "!node_modules/@sanity/**",
    "!node_modules/puppeteer/**",
    "!node_modules/puppeteer-core/**",
    "!node_modules/@puppeteer/**",
    "!node_modules/three/**",
    "!node_modules/@react-three/**",
    "!node_modules/@swc/**",
    "!node_modules/typescript/**",
    "!node_modules/vitest/**",
    "!node_modules/@vitest/**",
    "!public/movie/**",
    "!public/demos/**",
    "!public/images/**",
    "!public/audio/**",
    "!public/sitemap-screenshots/**",
    "!public/uploads/**"
  ]
  external_node_modules = [
    "@tensorflow/tfjs",
    "nsfwjs",
    "@tensorflow/tfjs-core",
    "@tensorflow/tfjs-backend-cpu",
    "sanity",
    "@sanity/client",
    "@sanity/image-url",
    "@sanity/ui",
    "@sanity/icons",
    "puppeteer",
    "puppeteer-core",
    "three",
    "@react-three/fiber",
    "@react-three/drei"
  ]

[functions."___netlify-server-handler"]
  included_files = [
    "!node_modules/@tensorflow/**",
    "!node_modules/nsfwjs/**",
    "!node_modules/sanity/**",
    "!node_modules/@sanity/**",
    "!node_modules/puppeteer/**",
    "!node_modules/puppeteer-core/**",
    "!node_modules/@puppeteer/**",
    "!node_modules/three/**",
    "!node_modules/@react-three/**",
    "!node_modules/@swc/**",
    "!node_modules/typescript/**",
    "!node_modules/vitest/**",
    "!node_modules/@vitest/**",
    "!public/movie/**",
    "!public/demos/**",
    "!public/images/**",
    "!public/audio/**",
    "!public/sitemap-screenshots/**",
    "!public/uploads/**"
  ]
  external_node_modules = [
    "@tensorflow/tfjs",
    "nsfwjs",
    "@tensorflow/tfjs-core",
    "@tensorflow/tfjs-backend-cpu",
    "sanity",
    "@sanity/client",
    "@sanity/image-url",
    "@sanity/ui",
    "@sanity/icons",
    "puppeteer",
    "puppeteer-core",
    "three",
    "@react-three/fiber",
    "@react-three/drei"
  ]

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

