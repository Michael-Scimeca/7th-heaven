[build]
  command = "npm run build"
  publish = ".next"


[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions."*"]
  included_files = [
    "!node_modules/@tensorflow/**",
    "!node_modules/nsfwjs/**",
    "!node_modules/sanity/**",
    "!node_modules/@sanity/**",
    "!node_modules/puppeteer/**",
    "!node_modules/puppeteer-core/**",
    "!node_modules/@puppeteer/**",
    "!node_modules/three/**",
    "!node_modules/@react-three/**",
    "!node_modules/three-stdlib/**",
    "!node_modules/stats-gl/**",
    "!node_modules/typescript/**",
    "!node_modules/vitest/**",
    "!node_modules/@vitest/**",
    "!node_modules/leaflet/**",
    "!node_modules/react-leaflet/**",
    "!node_modules/swiper/**",
    "!node_modules/lottie-web/**",
    "!node_modules/hls.js/**",
    "!node_modules/@sentry/**",
    "!node_modules/@sentry-internal/**",
    "!node_modules/@opentelemetry/**",
    "!node_modules/@electric-sql/**",
    "!node_modules/@mediapipe/**",
    "!node_modules/lucide-react/**",
    "!public/**"
  ]
  external_node_modules = [
    "@tensorflow/tfjs",
    "nsfwjs",
    "@tensorflow/tfjs-core",
    "@tensorflow/tfjs-backend-cpu",
    "sanity",
    "@sanity/client",
    "@sanity/image-url",
    "@sanity/ui",
    "@sanity/icons",
    "puppeteer",
    "puppeteer-core",
    "three",
    "@react-three/fiber",
    "@react-three/drei",
    "@supabase/supabase-js",
    "@supabase/ssr",
    "resend",
    "twilio",
    "sharp",
    "lucide-react"
  ]

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/movie/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache the homepage HTML at the Edge CDN for 1 hour
# This guarantees <50ms TTFB on all non-first requests
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=3600, stale-while-revalidate=86400"
